<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart College Website Portal - departments, courses, faculty, notices and enquiry form">
  <title>Smart College Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header class="site-header">
    <div class="container header-inner">
      <a href="#/home" class="brand" aria-label="Smart College Portal home">
        <span class="brand-logo">🎓</span>
        <span>
          <strong id="collegeName">Smart College Portal</strong>
          <small id="collegeTagline">Learn. Build. Lead.</small>
        </span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>

    <!-- NAVIGATION -->
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <div class="container">
        <ul>
          <li><a href="#/home" data-route="home">Home</a></li>
          <li><a href="#/departments" data-route="departments">Departments</a></li>
          <li><a href="#/courses" data-route="courses">Courses</a></li>
          <li><a href="#/faculty" data-route="faculty">Faculty</a></li>
          <li><a href="#/notices" data-route="notices">Notices</a></li>
          <li><a href="#/enquiry" data-route="enquiry">Enquiry</a></li>
        </ul>
      </div>
    </nav>
  </header>


  <main id="content" class="container content" tabindex="-1" aria-live="polite">
    <p class="loading">Loading...</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <h4>Smart College Portal</h4>
        <p id="footAddress"></p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <p>
          <a href="#/departments">Departments</a> ·
          <a href="#/courses">Courses</a> ·
          <a href="#/faculty">Faculty</a> ·
          <a href="#/notices">Notices</a>
        </p>
      </div>
      <div>
        <h4>Contact</h4>
        <p id="footContact"></p>
      </div>
    </div>
    <div class="copy">© 2026 Smart College Portal </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/component.js"></script>
  <script src="js/views.js"></script>
  <script src="js/route.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
